<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Folio logo options</title>
    <style>
      body { margin: 0; background: #f6f9fd; color: #162033; font-family: Georgia, serif; }
      main { max-width: 980px; margin: 0 auto; padding: 32px 20px 64px; }
      h1 { font-weight: 500; font-size: 32px; margin: 0 0 8px; }
      p { color: #5c6b80; margin: 0 0 28px; }
      .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 18px; }
      figure { margin: 0; background: #fff; border: 1px solid #e3e9f1; border-radius: 16px; overflow: hidden; }
      img { display: block; width: 100%; height: auto; }
      figcaption { padding: 12px 14px 14px; font-family: sans-serif; font-size: 14px; }
      strong { display: block; font-size: 16px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Choose a mark</h1>
      <p>The site logo is unchanged. Tell me the number.</p>
      <div class="grid">
        <figure><img src="/logos/1.jpg" alt="Page" /><figcaption><strong>1. Page</strong>A brief, with the line on the page.</figcaption></figure>
        <figure><img src="/logos/2.jpg" alt="Open folio" /><figcaption><strong>2. Open folio</strong>Two pages and one line across them.</figcaption></figure>
        <figure><img src="/logos/3.jpg" alt="Letter" /><figcaption><strong>3. Letter</strong>A serif F, nothing else.</figcaption></figure>
        <figure><img src="/logos/4.jpg" alt="Line" /><figcaption><strong>4. Line</strong>Only the chart.</figcaption></figure>
        <figure><img src="/logos/5.jpg" alt="Fold" /><figcaption><strong>5. Fold</strong>A page corner, with the line underneath.</figcaption></figure>
        <figure><img src="/logos/6.jpg" alt="Stack" /><figcaption><strong>6. Stack</strong>Three sheets, like a brief.</figcaption></figure>
        <figure><img src="/logos/7.jpg" alt="Small letter" /><figcaption><strong>7. Small letter</strong>A lowercase mark.</figcaption></figure>
        <figure><img src="/logos/8.jpg" alt="Seal" /><figcaption><strong>8. Seal</strong>A circle, with the line inside.</figcaption></figure>
        <figure><img src="/logos/9.jpg" alt="Stroke" /><figcaption><strong>9. Stroke</strong>One line that reads as an F.</figcaption></figure>
        <figure><img src="/logos/10.jpg" alt="Mark" /><figcaption><strong>10. Mark</strong>A ribbon, with the line across it.</figcaption></figure>
      </div>
    </main>
  </body>
</html>
